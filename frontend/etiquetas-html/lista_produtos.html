<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/listaprodutos_styles.css">
    <link rel="stylesheet" href="estilos/listaprodutos_media-query.css">
    <title>Lista de Produtos</title>
</head>
<body>
    <header class="cabecalho">

        <div class="logo">
            <h1>Etiqueta Express</h1>
        </div> <!-- Nome provisorio e futuro logo -->

        <nav class="menu">
            <ul>
                <li><a href="index.html">Produto</a></li>
                <li><a href="lista_produtos.html">Lista de Produtos</a></li>
                <li><a href="criarProducao.html">Produção</a></li>
                <li><a href="listaProducoes.html">Lista de Produções</a></li>
                <li><a href="gerarEtiqueta.html">Etiqueta</a></li>
                <li>
                    <button id="botao-sair" type="button">
                        Sair
                    </button>
                </li>
            </ul>
        </nav>
        
    </header>

    <main>
        <section class="procurar">
            <h2>Listar Produtos</h2>
            <form>
                <label for="iprocurar">Procurar produto</label>
                <input type="search" name="procurar" id="iprocurar" placeholder="Ex: Parmegiana de frango">
                <button type="submit">Procurar</button>
            </form>
        </section>

        <div class="tabela-container">

            <table id="itabela">
                <caption>Lista de Produtos</caption>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nome do Produto</th>
                        <th>Validade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>

            </table>
        </div>
        
    </main>

    <footer class="rodape">
        <p>Desenvolvido by Lincoln Jardim</p>
    </footer>

    <script src="javascript/autenticacao.js"></script>
    <script src="javascript/logout.js"></script>
    <script src="javascript/listarProdutos.js"></script>
</body>
</html>
