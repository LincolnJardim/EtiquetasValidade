<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/editarproduto_styles.css">
    <link rel="stylesheet" href="estilos/editarproduto_media-query.css">
    <title>Editar Produto</title>
</head>
<body>
    <header class="cabecalho">

        <div class="logo">
            <h1>Etiqueta Express</h1>
        </div> <!-- Nome provisorio e futuro logo -->

        <nav class="menu">
            <ul>
                <li>Produto</li>
                <li>Lista de Produtos</li>
                <li>Produção</li>
                <li>Etiqueta</li>
                <li>
                    <button id="botao-sair" type="button">
                        Sair
                    </button>
                </li>
            </ul>
        </nav>
        
    </header>


    <main>
        <section class="cadastro">
            <h2>Editar Produto</h2>

            <form id="icadastro">
                <label for="iproduto">Nome do Produto</label>
                <select name="" id=""></select>
                <label for="ivalidade">Validade do Produto</label>
                <input type="number" name="validade" id="ivalidade" placeholder="Ex: 3">
                <button type="submit">Editar</button>
            </form>

        </section>

    </main>

    <footer class="rodape">
        <p>Desenvolvido by Lincoln Jardim</p>
    </footer>

    <script src="javascript/autenticacao.js"></script>
    <script src="javascript/logout.js"></script>
    <script src="javascript/editarProduto.js"></script>
</body>
</html>
