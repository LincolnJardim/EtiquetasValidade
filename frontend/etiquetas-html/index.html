<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/styles.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <title>Home</title>
</head>

<body>
    <header class="cabecalho">

        <div class="logo">
            <h1>Etiqueta Express</h1>
        </div> <!-- Nome provisorio e futuro logo -->

        <nav class="menu">
            <ul>
                <li><a href="index.html">Produto</a></li>
                <li><a href="lista_produtos.html">Lista de Produtos</a></li>
                <li><a href="criarProducao.html">Produção</a></li>
                <li><a href="listaProducoes.html">Lista de Produções</a></li>
                <li><a href="gerarEtiqueta.html">Etiqueta</a></li>
                <li>
                    <button id="botao-sair" type="button">
                        Sair
                    </button>
                </li>
            </ul>
        </nav>

    </header>


    <main>
        <section class="cadastro">
            <h2>Cadastrar Produto</h2>

            <form id="icadastro">
                <label for="iproduto">Nome do Produto</label>
                <input type="text" name="produto" id="iproduto" placeholder="Ex: Parmegiana de frango" required
                    minlength="5" maxlength="100">

                <label for="ivalidade">Validade do Produto</label>
                <input type="number" name="validade" id="ivalidade" placeholder="Ex: 3" required min="1" step="1">
                <button type="submit">Cadastrar</button>
            </form>

        </section>

    </main>

    <footer class="rodape">
        <p>Desenvolvido by Lincoln Jardim</p>
    </footer>

    <script src="javascript/autenticacao.js"></script>
    <script src="javascript/validacaoProduto.js"></script>
    <script src="javascript/criarProduto.js"></script>
    <script src="javascript/logout.js"></script>
</body>

</html>
