<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos/login-style.css">
    <link rel="stylesheet" href="estilos/login_media-query.css">
    <title>Login</title>
</head>
<body>
    <main>
        <section>
            <h1>Etiqueta Express</h1>
            <form id="formulario-login">
                <h2>Login</h2>
                <label for="iemail">E-mail</label>
                <input placeholder="E-mail" type="email" name="email" id="iemail" required>
                <label for="isenha">Senha</label>
                <input placeholder="Senha" type="password" name="senha" id="isenha" required>
                <button type="submit">Entrar</button>
            </form>
            <p id="mensagem-login" aria-live="polite"></p>
        </section>
    </main>

    <script src="javascript/login.js"></script>
</body>
</html>
